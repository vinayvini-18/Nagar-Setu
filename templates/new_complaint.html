{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <h3 class="mb-3">Report a New Civic Issue</h3>
            <form method="POST" enctype="multipart/form-data">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text" class="form-control" name="title" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <select class="form-select" name="category" required>
                        <option>Road Damage</option>
                        <option>Pothole</option>
                        <option>Garbage</option>
                        <option>Drainage</option>
                        <option>Water Leakage</option>
                        <option>Street Light</option>
                        <option>Traffic</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Priority</label>
                    <select class="form-select" name="priority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                        <option value="critical">Critical</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Location</label>
                    <input type="text" class="form-control" name="location">
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" rows="5" name="description" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Photos (up to 5)</label>
                    <input type="file" class="form-control" name="photos" accept="image/jpeg,image/png,image/gif,image/webp" multiple>
                    <div class="form-text">Each photo must be a JPG, PNG, GIF, or WEBP image. Maximum total upload size: 25 MB.</div>
                </div>
                <button class="btn btn-primary">Submit Complaint</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
